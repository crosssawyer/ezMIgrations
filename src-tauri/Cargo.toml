[package]
name = "ez-migrations"
version = "1.2.0"
description = "A lightweight Tauri app for managing .NET EF Core migrations"
authors = ["ezMigrations"]
edition = "2021"

[lib]
name = "ez_migrations_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Headless MCP server binary. Same in-process MCP code path the GUI runs in
# `setup()`, just without the Tauri window — for CI runs, automated agents,
# or machines where the desktop app isn't installed.
[[bin]]
name = "ezmigrations-mcp"
path = "src/bin/ezmigrations-mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
notify = "6"
tauri-plugin-dialog = "2.7"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "net", "macros", "signal"] }

# MCP server: exposes the Tauri command surface to AI agents over loopback HTTP.
rmcp = { version = "1.7", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
schemars = "0.8"
dirs = "5"

[dev-dependencies]
tempfile = "3"
