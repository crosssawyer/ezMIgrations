[package]
name = "ez-migrations"
version = "1.1.1"
description = "A lightweight Tauri app for managing .NET EF Core migrations"
authors = ["ezMigrations"]
edition = "2021"

[lib]
name = "ez_migrations_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
notify = "6"
tauri-plugin-dialog = "2.7"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "winauth"] }
keyring = "3"

[dev-dependencies]
tempfile = "3"
